<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tedesco da Cantiere</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
padding:20px;
background:#f5f5f5;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
}

.card{
background:white;
padding:20px;
margin:15px 0;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
cursor:pointer;
font-size:22px;
font-weight:bold;
text-align:center;
}

.card:hover{
background:#ececec;
}

#content{
background:white;
padding:20px;
border-radius:12px;
margin-top:20px;
white-space:pre-wrap;
display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🇩🇪 Tedesco da Cantiere</h1>

<div class="card" onclick="loadDatabase()">
📚 Apri Database Completo
</div>

<div id="content">
Caricamento...
</div>

</div>

<script>
async function loadDatabase() {

const content = document.getElementById("content");

content.style.display = "block";
content.innerHTML = "Caricamento database...";

try {

const response = await fetch("database.md");
const text = await response.text();

content.textContent = text;

} catch(error) {

content.textContent =
"Errore nel caricamento del database.";

}

}
</script>

</body>
</html>
